<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0a0c" />
<title>LEAD ROLE — Movie Star Physique</title>
<meta name="description" content="Build the Hollywood leading-man physique: broad shoulders, lean waist, mobile & athletic. Programs, exercise library, golden-ratio analyzer, nutrition and an aesthetics academy." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lead Role" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="brand"><span class="dot"></span>LEAD&nbsp;<b>ROLE</b></div>
    <div class="row gap10">
      <span class="kicker" id="htitle">Today</span>
      <button class="hbtn" id="settingsBtn" aria-label="Plan settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2l-.4-2.6H9.9l-.4 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12a7 7 0 00.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2l.4 2.6h4.2l.4-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0019 12z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-aesthetic"></section>
  <section class="view" id="v-mobility"></section>
  <section class="view" id="v-fuel"></section>
</main>

<!-- Rest timer -->
<div id="rest">
  <div class="rest-in"><div class="rest-card">
    <div class="rest-time" id="restTime">2:00</div>
    <div style="flex:1"><div class="lab">Rest</div><div class="sub" id="restSub">Recover fully</div></div>
    <button class="iconbtn" id="restMinus" aria-label="−15s"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="iconbtn" id="restPlus" aria-label="+15s"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="iconbtn" id="restStop" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div></div>
</div>

<!-- Bottom sheet -->
<div id="sheet"><div class="sheet-bg" id="sheetBg"></div><div class="sheet-card" id="sheetCard"></div></div>

<!-- Onboarding / settings modal -->
<div id="modal"><div class="modal-bg" id="modalBg"></div><div class="modal-card"><div id="modal-body"></div></div></div>

<div class="toast" id="toast"></div>

<!-- Bottom nav -->
<nav><div class="nav-in">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button data-v="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M4 9l-1 1 2 2-2 2 1 1M20 15l1-1-2-2 2-2-1-1"/><rect x="7" y="7" width="10" height="10" rx="1" transform="rotate(45 12 12)"/></svg>Train</button>
  <button data-v="aesthetic"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5-2.3 1-5.5-4-3.9L9.5 8z"/></svg>Blueprint</button>
  <button data-v="mobility"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v6m0 0l-4 6m4-6l4 6M7 11h10"/></svg>Mobility</button>
  <button data-v="fuel"><svg viewBox="0 0 24 24"><path d="M5 3v7a3 3 0 003 3v8M8 3v6M19 3c-1.5 1-2.5 3-2.5 6V13c0 1 .8 1 1.5 1v7"/></svg>Fuel</button>
</div></nav>

<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
