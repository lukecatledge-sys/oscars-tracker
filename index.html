<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0b0d" />
<title>LEAD ROLE — Movie Star Physique</title>
<meta name="description" content="An original, gym-ready training program for the Hollywood leading-man physique: broad shoulders, lean waist, mobile & athletic." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lead Role" />
<style>
:root{
  --bg:#0b0b0d; --bg2:#141418; --card:#17171c; --card2:#1d1d24;
  --line:#27272f; --txt:#f4f4f6; --mut:#9a9aa6; --mut2:#6f6f7a;
  --gold:#d8b46a; --gold2:#b8923f; --acc:#e6c277; --ok:#5fd0a0; --bad:#e8736a;
  --r:16px; --tap:#ffffff14;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(76px + var(--safe-b))}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}
p{margin:0;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0b0b0dee,#0b0b0dcc);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-top:calc(10px + var(--safe-t))}
.hbar{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.14em;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.brand b{color:var(--gold)}
.htitle{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.02em}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#101015f2;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-in button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut2);font-size:10px;font-weight:700;letter-spacing:.02em}
.nav-in button.on{color:var(--gold)}
.nav-in svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Generic */
.view{display:none;padding:18px 0 24px;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.tap{transition:transform .12s,background .15s}
.card.tap:active{transform:scale(.985);background:var(--card2)}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--gold);text-transform:uppercase}
.muted{color:var(--mut)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap-g{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--mut);background:var(--bg2);border:1px solid var(--line);padding:5px 9px;border-radius:999px}
.tag.gold{color:var(--gold);border-color:#d8b46a44;background:#d8b46a14}
.divider{height:1px;background:var(--line);margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px}
.btn:active{background:#26262f}
.btn.gold{background:linear-gradient(180deg,var(--acc),var(--gold2));color:#1a1408;border:none}
.btn.full{width:100%}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px}
.btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Hero */
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 120% at 80% -10%,#2a2418 0%,#141319 42%,#0f0f13 100%);padding:20px;margin-bottom:16px}
.hero .eyebrow{margin-bottom:8px}
.hero h1{font-size:26px;line-height:1.05}
.hero h1 span{color:var(--gold)}
.hero p{margin-top:8px;color:var(--mut);font-size:13.5px;max-width:90%}
.streak{display:flex;gap:6px;margin-top:14px}
.streak .d{flex:1;height:6px;border-radius:4px;background:#2a2a32}
.streak .d.on{background:linear-gradient(90deg,var(--acc),var(--gold2))}

/* Today workout */
.daypill{display:inline-flex;align-items:center;gap:8px;background:#d8b46a18;border:1px solid #d8b46a44;color:var(--gold);
  font-weight:800;font-size:12px;letter-spacing:.06em;padding:6px 11px;border-radius:999px}
.ex{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.ex-h{display:flex;align-items:center;gap:12px;padding:13px 14px}
.ex-n{font-weight:800;font-size:15px}
.ex-meta{font-size:12px;color:var(--mut);margin-top:2px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid #3a3a44;flex:none;display:grid;place-items:center;transition:.15s}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk svg{width:15px;height:15px;stroke:#0b0b0d;stroke-width:3.2;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.chk.done svg{opacity:1}
.ex.done .ex-n{color:var(--mut);text-decoration:line-through;text-decoration-color:#ffffff30}
.scheme{font-weight:800;color:var(--gold);font-size:13px}
.ex-body{border-top:1px solid var(--line);padding:12px 14px;display:none;background:var(--bg2)}
.ex.open .ex-body{display:block}
.sets{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 38px;gap:8px;align-items:center}
.setrow .lbl{font-size:12px;color:var(--mut2);font-weight:700}
.inp{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--txt);font-size:14px;width:100%;text-align:center;font-weight:700}
.inp::placeholder{color:var(--mut2);font-weight:500}
.inp:focus{outline:none;border-color:var(--gold2)}
.setdone{width:30px;height:30px;border-radius:8px;border:1.5px solid #3a3a44;display:grid;place-items:center}
.setdone.on{background:var(--ok);border-color:var(--ok)}
.setdone svg{width:14px;height:14px;stroke:#0b0b0d;stroke-width:3;fill:none;opacity:0}
.setdone.on svg{opacity:1}
.cuehint{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.5}

/* Rest timer */
#rest{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));z-index:35;transform:translateY(140%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#rest.up{transform:none}
.rest-in{max-width:680px;margin:0 auto;padding:0 16px 12px}
.rest-card{background:#1b160c;border:1px solid #d8b46a55;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 40px #000a}
.rest-time{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);min-width:84px}
.rest-card .lab{font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:800;text-transform:uppercase}
.rest-card .sub{font-size:12px;color:var(--mut)}
.iconbtn{width:38px;height:38px;border-radius:10px;background:#ffffff12;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:var(--txt);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* lists */
.libitem{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.libitem:active{background:var(--card2)}
.thumb{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#2a2418,#161620);border:1px solid var(--line);color:var(--gold)}
.thumb svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px 13px 40px;color:var(--txt);font-size:15px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--gold2)}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:13px;top:13px;width:18px;height:18px;stroke:var(--mut2);stroke-width:2;fill:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--gold);color:#1a1408;border-color:var(--gold)}

/* Detail sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:#000a;backdrop-filter:blur(2px)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;
  background:var(--bg2);border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--line);
  padding:8px 18px calc(28px + var(--safe-b));animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:3px;background:#3a3a44;margin:8px auto 14px}
.sheet-hero{height:150px;border-radius:16px;background:radial-gradient(120% 120% at 70% 0%,#2a2418,#161620);
  border:1px solid var(--line);display:grid;place-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.sheet-hero svg.fig{width:96px;height:96px;stroke:var(--gold);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.musclebar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.mb{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;background:#d8b46a14;color:var(--gold);border:1px solid #d8b46a33}
.steps{counter-reset:s;margin:8px 0 0;padding:0;list-style:none}
.steps li{position:relative;padding:0 0 12px 34px;color:var(--txt);font-size:14px;line-height:1.5}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:7px;
  background:var(--gold);color:#1a1408;font-weight:900;font-size:12px;display:grid;place-items:center}
.cuelist{margin:6px 0 0;padding:0;list-style:none}
.cuelist li{padding:7px 0 7px 24px;position:relative;font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line)}
.cuelist li:last-child{border-bottom:none}
.cuelist li::before{content:"";position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.cuelist.bad li::before{background:var(--bad);border-radius:2px}
.sec-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);font-weight:800;margin:20px 0 8px}

/* nutrition calc */
.calc-row{display:flex;gap:10px;margin-bottom:10px}
.calc-row label{flex:1}
.calc-row .lab{font-size:12px;color:var(--mut);font-weight:700;display:block;margin-bottom:5px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--gold)}
.stat span{font-size:11px;color:var(--mut);letter-spacing:.04em}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--gold);color:#1a1408}

.daynav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.daybtn{flex:none;min-width:62px;text-align:center;padding:10px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.daybtn .dn{font-size:10px;color:var(--mut2);font-weight:700;letter-spacing:.08em}
.daybtn .dl{font-size:13px;font-weight:800;margin-top:3px}
.daybtn.on{background:#d8b46a18;border-color:#d8b46a55}
.daybtn.on .dl{color:var(--gold)}
.daybtn.rest .dl{color:var(--mut2)}

.note{background:#1a160c;border:1px solid #d8b46a33;border-radius:12px;padding:12px 14px;font-size:13px;color:#e8d6ad;line-height:1.5}
.foot{text-align:center;color:var(--mut2);font-size:11px;padding:24px 0 8px;line-height:1.6}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#26262f;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;
  opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.progress-ring{transform:rotate(-90deg)}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div class="brand"><span class="dot"></span>LEAD&nbsp;<b>ROLE</b></div>
    <div class="htitle" id="htitle">Today</div>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-program"></section>
  <section class="view" id="v-library"></section>
  <section class="view" id="v-mobility"></section>
  <section class="view" id="v-fuel"></section>
</main>

<!-- Rest timer -->
<div id="rest">
  <div class="rest-in">
    <div class="rest-card">
      <div class="rest-time" id="restTime">2:00</div>
      <div style="flex:1">
        <div class="lab">Rest</div>
        <div class="sub" id="restSub">Heavy set — recover fully</div>
      </div>
      <button class="iconbtn" id="restMinus"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="iconbtn" id="restPlus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" id="restStop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    </div>
  </div>
</div>

<!-- Exercise detail sheet -->
<div id="sheet">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" id="sheetCard"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Bottom nav -->
<nav>
  <div class="nav-in">
    <button data-v="today" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Today</button>
    <button data-v="program">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Program</button>
    <button data-v="library">
      <svg viewBox="0 0 24 24"><path d="M6.5 4h11a1 1 0 011 1v15l-6.5-3-6.5 3V5a1 1 0 011-1z"/></svg>Moves</button>
    <button data-v="mobility">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 8v6m0 0l-4 6m4-6l4 6M7 11h10"/></svg>Mobility</button>
    <button data-v="fuel">
      <svg viewBox="0 0 24 24"><path d="M5 3v7a3 3 0 003 3v8M8 3v6M19 3c-1.5 1-2.5 3-2.5 6V13c0 1 .8 1 1.5 1v7"/></svg>Fuel</button>
  </div>
</nav>

<script>
/* ============================================================
   LEAD ROLE — Movie Star Physique
   Original program built on standard, non-proprietary
   strength-training principles (V-taper aesthetics, reverse
   pyramid training, lean nutrition, mobility).
   ============================================================ */

/* ---------- generic figure glyphs ---------- */
const FIG = {
  press:'<path d="M12 3a2 2 0 100 4 2 2 0 000-4z"/><path d="M12 7v7m0 0l-3 7m3-7l3 7"/><path d="M6 6l6 3 6-3"/><path d="M3 6h3M18 6h3"/>',
  pull:'<path d="M12 3a2 2 0 100 4 2 2 0 000-4z"/><path d="M5 5h14"/><path d="M9 5l3 6 3-6M12 11v4m0 0l-2 6m2-6l2 6"/>',
  legs:'<path d="M12 3a2 2 0 100 4 2 2 0 000-4z"/><path d="M12 7v6l-4 8M12 13l4 8M8 10h8"/>',
  core:'<path d="M12 3a2 2 0 100 4 2 2 0 000-4z"/><path d="M12 7v5M8 9c1.5 1.5 6.5 1.5 8 0M9 12l-2 9M15 12l2 9"/>',
  shoulder:'<path d="M12 3a2 2 0 100 4 2 2 0 000-4z"/><path d="M5 9l7-2 7 2M12 7v8M9 21l3-6 3 6"/>',
  mobility:'<path d="M12 3a2 2 0 100 4 2 2 0 000-4z"/><circle cx="12" cy="13" r="3"/><path d="M4 13h5M15 13h5M12 7v3"/>'
};

/* ---------- EXERCISE LIBRARY ---------- */
const EX = {
  ohp:{name:"Standing Overhead Press",group:"shoulder",equip:"Barbell",icon:"press",
    muscles:["Front/side delts","Triceps","Upper chest","Core"],
    why:"The #1 builder of the round, capped shoulders that create the broad-on-top silhouette. Pressing overhead from the floor also forces full-body tension and bracing.",
    steps:["Set the bar at collarbone height in the rack. Grip just outside shoulder width, elbows slightly in front of the bar.","Unrack, take one step back, brace your abs and squeeze your glutes — ribs down, not flared.","Tuck your chin back slightly and press the bar straight up in a vertical line past your face.","Once the bar clears your forehead, push your head 'through' so the bar finishes stacked over the mid-foot.","Lower under control back to the collarbone. Re-brace each rep."],
    cues:["Squeeze glutes hard — it stops you leaning back and turning it into an incline press.","Wrists stacked over elbows, over the bar. No bent-back wrists.","Full lockout overhead with biceps near the ears."],
    faults:["Leaning back / pressing the bar forward instead of up.","Flaring the ribcage — kills the core brace and stresses the lower back.","Half-locking out — you lose the top-end delt and triceps work."]},

  inclinebp:{name:"Incline Barbell/DB Press",group:"shoulder",equip:"Barbell or DB",icon:"press",
    muscles:["Upper chest","Front delts","Triceps"],
    why:"Upper-chest fullness is what makes the chest look like 'armor' under a shirt. The incline angle builds the shelf without overdeveloping the lower chest.",
    steps:["Set the bench to 30° (low incline — higher turns it into a shoulder press).","Plant feet, slight arch, shoulder blades pulled back and down into the bench.","Lower the bar/dumbbells to the upper chest, elbows tucked ~45° from the body.","Drive up and slightly back so the weight finishes over the upper chest, not the face.","Control the descent — 2 seconds down."],
    cues:["Shoulder blades pinched the whole set — protects the shoulder and isolates the chest.","Touch the upper chest, not the throat.","Think 'press the body away from the bar.'"],
    faults:["Bench too steep — turns into a front-delt exercise.","Elbows flared to 90° — shoulder strain.","Bouncing the bar off the chest."]},

  latraise:{name:"Lateral Raise",group:"shoulder",equip:"Dumbbells / Cable",icon:"shoulder",
    muscles:["Side delts"],
    why:"The single most important move for width. Side-delt growth widens your frame and shrinks the waist by comparison — the core of the V-taper illusion.",
    steps:["Hold dumbbells at your sides, slight bend in the elbows held constant.","Lean forward ~10° to bias the side delt. Tilt the pinky slightly up ('pouring water').","Raise out to the sides until the wrists reach shoulder height — no higher.","Lead with the elbows, not the hands.","Lower slowly over 2–3 seconds. No swinging."],
    cues:["Light weight, perfect form — ego has no place here.","Pause for a beat at the top.","Imagine pushing the weights away from your body, not just up."],
    faults:["Using momentum / shrugging the traps up.","Going too heavy and turning it into an upright row.","Raising above shoulder height (traps take over)."]},

  pullup:{name:"Weighted Pull-Up / Chin-Up",group:"pull",equip:"Bar + belt",icon:"pull",
    muscles:["Lats","Upper back","Biceps"],
    why:"Builds the wide lats that taper down to the waist — the back half of the V. Weighted progression is what separates a strong-looking back from a flat one.",
    steps:["Grip the bar slightly wider than shoulders (pull-up) or shoulder-width underhand (chin-up).","Start from a dead hang, then pull the shoulder blades down and back first.","Drive the elbows down toward your hips and pull your chest to the bar.","Pause at the top with the collarbone near the bar.","Lower all the way to a full hang under control."],
    cues:["Lead with the chest, not the chin.","Think 'elbows to back pockets' to fire the lats.","Once you hit 8 clean reps, add weight with a dip belt."],
    faults:["Half reps / not reaching a full dead hang.","Kipping and swinging for momentum.","Shrugging up instead of pulling the shoulders down."]},

  row:{name:"Barbell / Cable Row",group:"pull",equip:"Barbell or Cable",icon:"pull",
    muscles:["Mid-back","Lats","Rear delts","Biceps"],
    why:"Adds thickness and detail to the back and pulls the shoulders back for better posture — a big part of looking 'put together'.",

const LS_KEY="leadrole.v1";

function load(){try{return JSON.parse(localStorage.getItem(LS_KEY))||fresh();}catch(e){return fresh();}}
function fresh(){return {logs:{},done:{},history:[],bw:175,unit:"lb",goal:"lean"};}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(state));}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

  html+=`<div class="card">
    <div class="row between" style="margin-bottom:4px">
      <span class="daypill">${phase.name.split('·')[0].trim()} · ${day.d}</span>

    }

        <button class="chk ${done?'done':''}" onclick="toggleDone(${i},this);event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></button>

function schemeSets(s){
  if(s.includes("×")){const m=s.match(/(\d+)\s*×/);return m?+m[1]:3;}
  const seg=s.split("·").pop();
  return (seg.match(/\//g)||[]).length+1;
}
function ringSVG(pct){
  const r=15,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<svg width="40" height="40" class="progress-ring" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="${r}" stroke="#2a2a32" stroke-width="4" fill="none"/>
    <circle cx="20" cy="20" r="${r}" stroke="#d8b46a" stroke-width="4" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    <text x="20" y="24" text-anchor="middle" transform="rotate(90 20 20)" fill="#d8b46a" font-size="11" font-weight="800">${pct}%</text>
  </svg>`;
}
function last7Dots(){
  let out="";
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    out+=`<div class="d ${state.history.includes(k)?'on':''}"></div>`;
  }
  return out;
}
function fmtDate(){const d=new Date();return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function toggleExpand(i){document.getElementById("ex-"+i).classList.toggle("open");}
function toggleDone(i){const dk=todayKey();state.done[dk]=state.done[dk]||{};state.done[dk][i]=!state.done[dk][i];save();render_today();}
function logSet(key,s,field,val){state.logs[key]=state.logs[key]||{};state.logs[key][s]=state.logs[key][s]||{};state.logs[key][s][field]=val;save();}
function toggleSet(key,s,btn){state.logs[key]=state.logs[key]||{};state.logs[key][s]=state.logs[key][s]||{};state.logs[key][s].done=!state.logs[key][s].done;save();btn.classList.toggle("on");}
function finishWorkout(){const k=todayKey();if(!state.history.includes(k))state.history.push(k);save();toast("Workout logged — recover hard 💪");render_today();}

        <div style="flex:1">
          <div class="ex-n" style="font-size:14.5px">${e.name}</div>
          <div class="ex-meta"><span class="scheme">${item.scheme}</span> · rest ${item.rest}</div>
        </div>
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--mut2);stroke-width:2;fill:none"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>`;
  });
  html+=`</div>`;
  html+=`<div class="card">
    <h3 style="font-size:15px">How to run it</h3>
    <ul class="cuelist" style="margin-top:8px">
      <li><b>Reverse Pyramid (RPT):</b> warm up, then do your heaviest set first. Drop the weight ~10% and add 1–2 reps for each following set.</li>
      <li><b>Progress every week:</b> when you hit the top of a rep range on your first set, add the smallest weight increment next time.</li>
      <li><b>Leave 1–2 reps in the tank</b> on heavy sets. Quality &amp; longevity beat grinding to failure.</li>
      <li><b>Isolation moves</b> (raises, curls, pushdowns): chase reps and the squeeze, not max weight.</li>
      <li><b>Always warm up</b> the joints (Mobility tab) before the first heavy lift.</li>
    </ul>
  </div>`;
  el.innerHTML=html+footer();
}

/* ============================================================ LIBRARY ============================================================ */
let libFilter="all", libSearch="";
const GROUPS={all:"All",shoulder:"Shoulders & Chest",pull:"Back & Arms",legs:"Legs",core:"Core"};
function render_library(){
  const el=document.getElementById("v-library");
  let html=`<div class="searchwrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input class="search" placeholder="Search exercises…" value="${libSearch}" oninput="libSearch=this.value;renderLibList()">
  </div>
  <div class="chips">${Object.entries(GROUPS).map(([k,v])=>
    `<button class="chip ${libFilter===k?'on':''}" onclick="libFilter='${k}';render_library()">${v}</button>`).join("")}</div>
  <div id="libList"></div>`;
  el.innerHTML=html;
  renderLibList();
  el.insertAdjacentHTML("beforeend",footer());
}
function renderLibList(){
  const list=document.getElementById("libList");
  const q=libSearch.toLowerCase();
  const items=Object.entries(EX).filter(([id,e])=>{
    const okG=libFilter==="all"||e.group===libFilter;
    const okS=!q||e.name.toLowerCase().includes(q)||e.muscles.join(" ").toLowerCase().includes(q);
    return okG&&okS;
  });
  if(!items.length){list.innerHTML=`<p class="muted small" style="text-align:center;padding:20px">No moves match.</p>`;return;}
  list.innerHTML=items.map(([id,e])=>`
    <div class="libitem" onclick="openEx('${id}')">
      <div class="thumb"><svg viewBox="0 0 24 24">${FIG[e.icon]}</svg></div>
      <div style="flex:1">
        <div class="ex-n" style="font-size:14.5px">${e.name}</div>
        <div class="ex-meta">${e.equip} · ${e.muscles[0]}</div>
      </div>
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--mut2);stroke-width:2;fill:none"><path d="M9 6l6 6-6 6"/></svg>
    </div>`).join("");
}

    <div class="grab"></div>
    <div class="sheet-hero"><svg class="fig" viewBox="0 0 24 24">${FIG[e.icon]}</svg></div>
    <div class="eyebrow">${e.equip}</div>
    <h2 style="font-size:22px;margin:6px 0 2px">${e.name}</h2>

    <a class="btn gold full" href="${yt}" target="_blank" rel="noopener" style="margin-top:16px">

document.getElementById("sheetBg").onclick=closeSheet;

/* ============================================================ MOBILITY ============================================================ */

    <div class="eyebrow">Move like an athlete</div>

    <p class="muted small">Strength without mobility ages badly. These routines keep your hips, shoulders and spine supple so you stay pain-free, move well, and look relaxed and athletic — not stiff. Hold each stretch with calm, deep breathing.</p>

/* ============================================================ FUEL ============================================================ */
function render_fuel(){
  const el=document.getElementById("v-fuel");
  const bw=state.bw||175, unit=state.unit||"lb", goal=state.goal||"lean";
  const bwLb = unit==="lb"?bw:Math.round(bw*2.205);
  const protein=Math.round(bwLb*0.9);
  const cals = goal==="lean"? Math.round(bwLb*13) : goal==="recomp"? Math.round(bwLb*15) : Math.round(bwLb*17);
  const fat=Math.round(bwLb*0.4);
  const carbs=Math.round((cals-(protein*4)-(fat*9))/4);

  let html=`<div class="card">
    <div class="eyebrow">Get lean, stay lean</div>
    <h2 style="margin:6px 0 8px;font-size:20px">Fuel the look</h2>
    <p class="muted small">The leading-man physique is mostly about being <b>lean</b> — abs and sharp lines show up around 8–12% body fat. The simplest sustainable approach: eat high protein, control total calories, and keep food choices mostly whole. An intermittent-fasting window (eat in ~8 hours, e.g. noon–8pm) makes calorie control effortless for most people.</p>
  </div>
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:12px">Your daily targets</h3>
    <div class="calc-row">
      <label><span class="lab">Body weight</span>
        <input class="inp" inputmode="decimal" value="${bw}" onchange="setBW(this.value)"></label>
      <label><span class="lab">Unit</span>
        <div class="seg" style="margin:0">
          <button class="${unit==='lb'?'on':''}" onclick="setUnit('lb')">lb</button>
          <button class="${unit==='kg'?'on':''}" onclick="setUnit('kg')">kg</button>
        </div></label>
    </div>
    <span class="lab" style="font-size:12px;color:var(--mut);font-weight:700">Goal</span>
    <div class="seg" style="margin-top:5px">
      <button class="${goal==='lean'?'on':''}" onclick="setGoal('lean')">Cut</button>
      <button class="${goal==='recomp'?'on':''}" onclick="setGoal('recomp')">Maintain</button>
      <button class="${goal==='gain'?'on':''}" onclick="setGoal('gain')">Lean Gain</button>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${cals}</b><span>CALORIES</span></div>
      <div class="stat"><b>${protein}g</b><span>PROTEIN</span></div>
      <div class="stat"><b>${carbs<0?0:carbs}g</b><span>CARBS</span></div>
    </div>
    <div class="stat" style="margin-top:10px"><b>${fat}g</b><span>FATS PER DAY</span></div>
    <p class="tiny muted" style="margin-top:10px">Estimates only — adjust by results. If the scale/mirror isn't moving over 2–3 weeks, nudge calories ±10%.</p>
  </div>
  <div class="card">
    <h3 style="font-size:15px">The 6 rules</h3>
    <ul class="cuelist" style="margin-top:8px">
      <li><b>Protein first.</b> Hit ~0.9–1g per lb of bodyweight daily. It builds muscle and kills hunger.</li>
      <li><b>Pick an eating window.</b> An ~8-hour window (e.g. 12–8pm) naturally trims mindless calories. Black coffee, water and tea during the fast.</li>
      <li><b>Mostly whole foods.</b> Meat, eggs, fish, fruit, veg, potatoes, rice, oats, dairy. Leave ~15% room for things you enjoy so it lasts.</li>
      <li><b>Lift heavy + eat enough protein</b> so the weight you lose is fat, not the muscle that creates the shape.</li>
      <li><b>Walk daily.</b> 8–10k steps burns meaningful calories without eating into recovery.</li>
      <li><b>Sleep 7–9 hours.</b> The most underrated fat-loss and muscle-building tool there is.</li>
    </ul>
  </div>`;
  el.innerHTML=html+footer();
}
function setBW(v){state.bw=parseFloat(v)||0;save();render_fuel();}
function setUnit(u){state.unit=u;save();render_fuel();}
function setGoal(g){state.goal=g;save();render_fuel();}

/* ============================================================ REST TIMER ============================================================ */
let restInt=null, restSec=0;
function startRest(str,name){
  const parts=str.split(":");restSec=(+parts[0])*60+(+parts[1]);
  document.getElementById("restSub").textContent=name+" — recover, then go again";
  document.getElementById("rest").classList.add("up");
  paintRest();clearInterval(restInt);
  restInt=setInterval(()=>{
    restSec--;paintRest();
    if(restSec<=0){clearInterval(restInt);buzz();document.getElementById("restSub").textContent="Time! Next set 💥";
      setTimeout(()=>document.getElementById("rest").classList.remove("up"),2500);}
  },1000);
}
function paintRest(){const m=Math.floor(Math.max(restSec,0)/60),s=Math.max(restSec,0)%60;document.getElementById("restTime").textContent=m+":"+String(s).padStart(2,"0");}
document.getElementById("restPlus").onclick=()=>{restSec+=15;paintRest();};
document.getElementById("restMinus").onclick=()=>{restSec=Math.max(0,restSec-15);paintRest();};
document.getElementById("restStop").onclick=()=>{clearInterval(restInt);document.getElementById("rest").classList.remove("up");};
function buzz(){if(navigator.vibrate)navigator.vibrate([200,100,200]);}

/* ============================================================ TOAST + FOOTER ============================================================ */
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200);}
function footer(){return `<div class="foot">LEAD ROLE · an original program built on standard strength-training principles.<br>
  Educational use only — not medical advice. Train smart, and see a doctor before starting any program.</div>`;}

/* ============================================================ INIT ============================================================ */
render_today();
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}
</script>
